name: API Authentication Tests

on:
  workflow_dispatch:

jobs:
  api-authentication:
    name: Cognito and API Authentication Tests
    runs-on: ubuntu-latest

    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_URL: ${{ vars.API_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_USERNAME: ${{ vars.COGNITO_USERNAME }}
      COGNITO_PASSWORD: ${{ secrets.COGNITO_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API authentication tests
        run: npx playwright test tests/API

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-authentication-report
          path: playwright-report/
          retention-days: 14
